name: Lean core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
      - name: Reject unchecked declarations
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' AllThoseBigRamsey; then exit 1; fi
      - name: Audit core proofs
        run: |
          set -euo pipefail
          lake env lean PseudotreeChecks.lean | tee pseudotree-axioms.txt
          if grep -q sorryAx pseudotree-axioms.txt; then exit 1; fi
